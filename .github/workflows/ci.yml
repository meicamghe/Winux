name: Winux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: winux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools and project
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .

      - name: Run unit tests
        run: timeout --signal=TERM --kill-after=30s 10m python -c 'import faulthandler, unittest; faulthandler.dump_traceback_later(300, repeat=True); suite = unittest.defaultTestLoader.discover("tests"); result = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())'

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test installed wheel CLI
        run: |
          python -m venv /tmp/winux-wheel-venv
          /tmp/winux-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/winux-wheel-venv/bin/winux --help
          /tmp/winux-wheel-venv/bin/python -c "import winux.service_runner; import winux.platform.local_bridge; import winux.core.local_bridge"
